name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Any Agent version
      placeholder: "e.g., 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: agent-framework
    attributes:
      label: Agent framework
      description: Which agent framework were you connecting to?
      options:
        - Demo agent (included)
        - Google ADK
        - LangGraph
        - Hermes / vLLM
        - CrewAI
        - AutoGen
        - Other (specify below)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant logs or screenshots.

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "e.g., 22.x"

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - npm run dev (local)
        - Docker / Docker Compose
        - Kubernetes / Helm
        - Other
