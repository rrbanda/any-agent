services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Agents can come from AGENTS env or from an agentregistry instance.
      # If AGENT_REGISTRY_URL is set, agents are fetched from the registry.
      # AGENTS env entries are merged (env takes precedence for same IDs).
      AGENTS: "${AGENTS:-{}}"
      APP_TITLE: "${APP_TITLE:-Any Agent}"
      # Optional: connect to an agentregistry instance
      # AGENT_REGISTRY_URL: "http://agentregistry:12121"
    restart: unless-stopped

  # Optional: uncomment to run agentregistry alongside Any Agent.
  # See https://github.com/agentregistry-dev/agentregistry for setup.
  # agentregistry:
  #   image: ghcr.io/agentregistry-dev/agentregistry:latest
  #   ports:
  #     - "12121:12121"
  #   restart: unless-stopped
