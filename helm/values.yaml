replicaCount: 1

image:
  repository: any-agent
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

# JSON map of agent name → endpoint config, injected as AGENTS env var.
# Protocol field is optional — if omitted, Any Agent auto-detects it.
# Example:
#   agents:
#     assistant:
#       url: "http://agent-svc:8080"
#       name: "Assistant"
#       protocol: "ag-ui"
#     hermes:
#       url: "http://hermes-svc:8000/v1/chat/completions"
#       name: "Hermes"
agents: {}

# Optional: connect to an agentregistry instance for agent discovery.
# When set, agents from the registry are merged with the agents above.
agentRegistry:
  url: ""

branding:
  title: "Any Agent"

auth:
  enabled: false
  oidcIssuerUrl: ""
  oidcClientId: ""
  oidcClientSecret: ""

route:
  enabled: true
  host: ""
  tlsTermination: edge

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilization: 80

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 30
