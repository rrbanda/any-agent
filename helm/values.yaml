replicaCount: 1

image:
  repository: any-agent
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

# JSON map of agent name → endpoint URL, injected as AGENTS env var.
# Example:
#   agents:
#     assistant: "http://agent-svc:8080/v1"
#     researcher: "http://researcher-svc:8081/v1"
agents: {}

branding:
  title: "Any Agent"
  primaryColor: "#6963ff"

route:
  enabled: true
  host: ""
  tlsTermination: edge

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /api/agents
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /api/agents
    initialDelaySeconds: 10
    periodSeconds: 30
