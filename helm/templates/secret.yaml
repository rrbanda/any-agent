{{- if or .Values.auth.enabled .Values.database.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "any-agent.fullname" . }}
  labels:
    {{- include "any-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.url }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if .Values.auth.enabled }}
  OIDC_ISSUER_URL: {{ .Values.auth.oidcIssuerUrl | quote }}
  OIDC_CLIENT_ID: {{ .Values.auth.oidcClientId | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.auth.oidcClientSecret | quote }}
  {{- end }}
{{- end }}
