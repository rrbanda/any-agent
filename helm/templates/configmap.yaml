apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "any-agent.fullname" . }}
  labels:
    {{- include "any-agent.labels" . | nindent 4 }}
data:
  AGENTS: {{ .Values.agents | toJson | quote }}
  APP_TITLE: {{ .Values.branding.title | quote }}
  {{- if .Values.agentRegistry.url }}
  AGENT_REGISTRY_URL: {{ .Values.agentRegistry.url | quote }}
  {{- end }}
